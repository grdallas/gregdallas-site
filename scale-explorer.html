<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scale Explorer">
<title>Scale Explorer</title>
<meta name="description" content="Free guitar scale reference — pick or type any scale and see it laid out across the whole neck, in any key.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap">
<style>
    /* ── "Archive" design system — matches gregdallas.com ─────────────── */
    :root {
        --bg:          #F6F2EA;
        --panel:       #EFEADF;
        --ink:         #241F1A;
        --dim:         #6B6157;
        --faint:       #948A7C;
        --rule:        #DCD4C6;
        --accent:      #8A4B2A;
        --accent-soft: #B98A64;
        --serif: "Newsreader", Georgia, "Times New Roman", serif;
        --sans:  "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

        /* aliases so the SVG-drawing JS (unchanged) resolves to this palette */
        --paper: var(--bg);
        --paper-dark: var(--panel);
        --ink-light: var(--dim);
        --ink-muted: var(--faint);
        --border: var(--rule);
        --amber: var(--accent);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: var(--serif);
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        font-size: 18px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }

    #app {
        padding: clamp(2rem, 6vw, 4rem) 1.25rem 3rem;
        max-width: 780px;
        margin: 0 auto;
        min-height: 100vh;
    }
    html.is-embed #app { padding: 1rem; max-width: none; }
    html.is-embed .tool-header { margin-bottom: 1rem; }
    html.is-embed .tool-header p { display: none; }

    .site-return {
        display: inline-block; font-family: var(--sans); font-size: .72rem;
        letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
        text-decoration: none; margin-bottom: 1.4rem;
    }
    .site-return:hover { color: var(--accent); }
    html.is-embed .site-return { display: none; }

    .tool-header { margin-bottom: clamp(1.75rem, 4vw, 2.5rem); }
    .eyebrow {
        font-family: var(--sans); font-size: 0.68rem; font-weight: 500; letter-spacing: 0.2em;
        text-transform: uppercase; color: var(--accent); margin-bottom: 0.9rem;
    }
    .tool-header h1 {
        font-family: var(--serif); font-weight: 400; letter-spacing: -0.02em;
        line-height: 1.12; font-size: clamp(2rem, 5.5vw, 2.9rem); margin-bottom: 0.6rem;
    }
    .tool-header p {
        font-family: var(--sans); font-size: 0.92rem; color: var(--dim); max-width: 48ch;
    }

    .card {
        border: 1px solid var(--rule);
        background: var(--panel);
        border-radius: 6px;
        padding: 1.4rem 1.3rem;
        margin-bottom: 1.4rem;
    }
    .control-group { margin-bottom: 1.3rem; }
    .control-group:last-child { margin-bottom: 0; }

    label.section-label {
        display: block;
        font-family: var(--sans);
        font-size: 0.66rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--faint);
        margin-bottom: 0.6rem;
    }

    /* ── Root note grid ─────────────────────────────────────────────── */
    .note-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 0.5rem;
    }
    .note-btn {
        padding: 0.55rem 0.2rem;
        background: var(--bg);
        border: 1px solid var(--rule);
        border-radius: 999px;
        font-family: var(--sans);
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--dim);
        cursor: pointer;
        transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .note-btn:hover { border-color: var(--accent-soft); color: var(--ink); }
    .note-btn.active {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        font-weight: 600;
    }

    /* ── Select / text input ────────────────────────────────────────── */
    select, input[type="text"] {
        width: 100%;
        padding: 0.6rem 0.7rem;
        background: var(--bg);
        border: 1px solid var(--rule);
        border-radius: 4px;
        font-family: var(--sans);
        font-size: 0.88rem;
        color: var(--ink);
    }
    select:focus, input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
    }
    .hint {
        font-family: var(--sans);
        font-size: 0.72rem;
        color: var(--faint);
        margin-top: 0.5rem;
        line-height: 1.5;
    }

    /* ── Range slider ───────────────────────────────────────────────── */
    .range-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
    }
    .range-val { font-family: var(--sans); font-size: 0.78rem; color: var(--accent); font-weight: 600; }
    input[type="range"] {
        width: 100%;
        height: 3px;
        -webkit-appearance: none;
        background: var(--rule);
        border-radius: 2px;
        outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        border: none;
    }

    /* ── Toggles ────────────────────────────────────────────────────── */
    .toggle-row { display: flex; flex-direction: column; gap: 0.6rem; }
    .toggle-row label {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-family: var(--sans);
        font-size: 0.85rem;
        color: var(--dim);
        cursor: pointer;
    }
    .toggle-row input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
        cursor: pointer;
    }

    /* ── Scale title display ───────────────────────────────────────── */
    .scale-display {
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 1.5rem 1.2rem;
        text-align: center;
        margin-bottom: 1.4rem;
    }
    .scale-title {
        font-family: var(--serif);
        font-weight: 400;
        letter-spacing: -0.01em;
        font-size: 2.1rem;
        color: var(--ink);
        margin-bottom: 0.6rem;
    }
    .scale-notes {
        font-family: var(--sans);
        font-size: 0.82rem;
        color: var(--faint);
        letter-spacing: 0.03em;
    }
    .scale-notes .root-note { color: var(--accent); font-weight: 600; }

    .drone-btn {
        margin-top: 1.1rem;
        font-family: var(--sans); font-size: 0.76rem; font-weight: 600;
        letter-spacing: 0.06em; text-transform: uppercase;
        padding: 0.55rem 1.2rem; border-radius: 999px;
        border: 1px solid var(--accent-soft); background: transparent; color: var(--accent);
        cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .drone-btn:hover { background: var(--accent-soft); color: #fff; }
    .drone-btn.playing { background: var(--accent); border-color: var(--accent); color: var(--bg); }

    /* ── Fretboard ──────────────────────────────────────────────────── */
    .fretboard-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 0.2rem;
    }
    #fretboard { display: block; }
    #fretboard text { font-family: var(--sans); }

    /* ── Legend ─────────────────────────────────────────────────────── */
    .legend {
        display: flex;
        gap: 1.6rem;
        justify-content: center;
        font-family: var(--sans);
        font-size: 0.76rem;
        color: var(--faint);
    }
    .legend-item { display: flex; align-items: center; gap: 0.5rem; }
    .legend-dot {
        width: 14px; height: 14px;
        border-radius: 50%;
        border: 1.4px solid var(--ink);
        display: inline-block;
    }
    .legend-dot.root { background: var(--accent); border-color: var(--accent); }
    .legend-dot.tone { background: var(--bg); }
</style>
</head>
<body>
<div id="app">
    <a class="site-return" href="teaching.html">&larr; Teaching</a>

    <div class="tool-header">
        <p class="eyebrow">Fretboard Reference</p>
        <h1>Scale Explorer</h1>
        <p>Choose or type a scale — see it laid out across the whole neck, in any key.</p>
    </div>

    <div class="card">
        <div class="control-group">
            <label class="section-label">Root</label>
            <div class="note-grid" id="noteGrid"></div>
        </div>
        <div class="control-group">
            <label class="section-label">Scale</label>
            <select id="scaleSelect">
                <optgroup label="Major Scale Modes">
                    <option value="major">Major (Ionian)</option>
                    <option value="dorian">Dorian</option>
                    <option value="phrygian">Phrygian</option>
                    <option value="lydian">Lydian</option>
                    <option value="mixolydian">Mixolydian</option>
                    <option value="naturalMinor">Natural Minor (Aeolian)</option>
                    <option value="locrian">Locrian</option>
                </optgroup>
                <optgroup label="Melodic Minor Modes">
                    <option value="melodicMinor">Melodic Minor</option>
                    <option value="dorianB2">Dorian ♭2 (Phrygian ♮6)</option>
                    <option value="lydianAugmented">Lydian Augmented</option>
                    <option value="lydianDominant">Lydian Dominant (Overtone)</option>
                    <option value="mixolydianB6">Mixolydian ♭6 (Melodic Major)</option>
                    <option value="locrianNat6">Locrian ♮2 (Half-Diminished)</option>
                    <option value="altered">Altered (Super Locrian)</option>
                </optgroup>
                <optgroup label="Harmonic Minor Modes">
                    <option value="harmonicMinor">Harmonic Minor</option>
                    <option value="locrianSharp6">Locrian ♮6</option>
                    <option value="ionianSharp5">Ionian ♯5 (Augmented Major)</option>
                    <option value="dorianSharp4">Dorian ♯4 (Ukrainian Dorian)</option>
                    <option value="phrygianDominant">Phrygian Dominant (Spanish)</option>
                    <option value="lydianSharp2">Lydian ♯2</option>
                    <option value="ultraLocrian">Ultra Locrian</option>
                </optgroup>
                <optgroup label="Harmonic Major &amp; Exotic">
                    <option value="harmonicMajor">Harmonic Major</option>
                    <option value="hungarianMinor">Hungarian (Gypsy) Minor</option>
                    <option value="hungarianMajor">Hungarian Major</option>
                    <option value="doubleHarmonic">Double Harmonic (Byzantine)</option>
                    <option value="neapolitanMinor">Neapolitan Minor</option>
                    <option value="neapolitanMajor">Neapolitan Major</option>
                    <option value="enigmatic">Enigmatic</option>
                    <option value="persian">Persian</option>
                </optgroup>
                <optgroup label="Pentatonic &amp; Blues">
                    <option value="majPent">Major Pentatonic</option>
                    <option value="minPent">Minor Pentatonic</option>
                    <option value="blues">Blues</option>
                    <option value="majorBlues">Major Blues</option>
                    <option value="suspendedPent">Suspended (Egyptian) Pentatonic</option>
                    <option value="hirajoshi">Hirajoshi (Japanese)</option>
                    <option value="inSen">In Sen (Japanese)</option>
                    <option value="iwato">Iwato (Japanese)</option>
                    <option value="kumoi">Kumoi (Japanese)</option>
                    <option value="yoScale">Yo Scale (Japanese)</option>
                </optgroup>
                <optgroup label="Symmetric">
                    <option value="wholeTone">Whole Tone</option>
                    <option value="dimWholeHalf">Diminished (Whole-Half)</option>
                    <option value="dimHalfWhole">Diminished (Half-Whole)</option>
                    <option value="augmented">Augmented (Symmetric)</option>
                    <option value="chromatic">Chromatic</option>
                </optgroup>
                <optgroup label="Bebop">
                    <option value="bebopDominant">Bebop Dominant</option>
                    <option value="bebopMajor">Bebop Major</option>
                    <option value="bebopMinor">Bebop Minor (Dorian)</option>
                </optgroup>
            </select>
        </div>
        <div class="control-group">
            <label class="section-label">Or type it</label>
            <input type="text" id="scaleInput" placeholder="e.g. C major, A minor pentatonic, F# dorian">
            <p class="hint">Try: C major &middot; A minor pentatonic &middot; F# dorian &middot; Eb blues &middot; G phrygian dominant &middot; Bb bebop dominant</p>
        </div>
        <div class="control-group">
            <div class="range-row">
                <label class="section-label" style="margin-bottom:0">Frets shown</label>
                <span class="range-val" id="fretCountVal">15</span>
            </div>
            <input type="range" id="fretCount" min="9" max="22" value="15">
        </div>
        <div class="control-group toggle-row">
            <label><input type="checkbox" id="showDegrees"> Show scale degrees instead of note names</label>
            <label><input type="checkbox" id="useFlats"> Use flats (&#9837;) instead of sharps (&#9839;)</label>
        </div>
    </div>

    <div class="scale-display">
        <div class="scale-title" id="scaleTitle">C Major</div>
        <div class="scale-notes" id="scaleNotesList"></div>
        <button type="button" class="drone-btn" id="droneBtn">&#9654; Play Drone</button>
    </div>

    <div class="card">
        <div class="fretboard-wrap">
            <svg id="fretboard" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="legend-dot root"></span> Root</div>
        <div class="legend-item"><span class="legend-dot tone"></span> Scale tone</div>
    </div>
</div>

<script>
    // ── Note data ──────────────────────────────────────────────────────────
    const NOTE_SHARP = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

    const LETTER_PC  = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };

    // ── Scale definitions ────────────────────────────────────────────────
    const SCALES = {

        // Melodic minor & its modes
        melodicMinor:   { label: 'Melodic Minor',             intervals: [0,2,3,5,7,9,11],  degrees: ['1','2','b3','4','5','6','7'] },
        dorianB2:       { label: 'Dorian ♭2',                 intervals: [0,1,3,5,7,9,10],  degrees: ['1','b2','b3','4','5','6','b7'] },
        lydianAugmented:{ label: 'Lydian Augmented',          intervals: [0,2,4,6,8,9,11],  degrees: ['1','2','3','#4','#5','6','7'] },
        lydianDominant: { label: 'Lydian Dominant',           intervals: [0,2,4,6,7,9,10],  degrees: ['1','2','3','#4','5','6','b7'] },
        mixolydianB6:   { label: 'Mixolydian ♭6',             intervals: [0,2,4,5,7,8,10],  degrees: ['1','2','3','4','5','b6','b7'] },
        locrianNat6:    { label: 'Locrian ♮2 (Half-Diminished)', intervals: [0,2,3,5,6,8,10], degrees: ['1','2','b3','4','b5','b6','b7'] },
        altered:        { label: 'Altered (Super Locrian)',  intervals: [0,1,3,4,6,8,10],  degrees: ['1','b2','b3','3','b5','b6','b7'] },

        // Harmonic minor & its modes
        harmonicMinor:  { label: 'Harmonic Minor',            intervals: [0,2,3,5,7,8,11],  degrees: ['1','2','b3','4','5','b6','7'] },
        locrianSharp6:  { label: 'Locrian ♮6',                intervals: [0,1,3,5,6,9,10],  degrees: ['1','b2','b3','4','b5','6','b7'] },
        ionianSharp5:   { label: 'Ionian ♯5',                 intervals: [0,2,4,5,8,9,11],  degrees: ['1','2','3','4','#5','6','7'] },
        dorianSharp4:   { label: 'Dorian ♯4',                 intervals: [0,2,3,6,7,9,10],  degrees: ['1','2','b3','#4','5','6','b7'] },
        phrygianDominant:{ label: 'Phrygian Dominant',        intervals: [0,1,4,5,7,8,10],  degrees: ['1','b2','3','4','5','b6','b7'] },
        lydianSharp2:   { label: 'Lydian ♯2',                 intervals: [0,3,4,6,7,9,11],  degrees: ['1','#2','3','#4','5','6','7'] },
        ultraLocrian:   { label: 'Ultra Locrian',             intervals: [0,1,3,4,6,8,9],   degrees: ['1','b2','b3','b4','b5','b6','bb7'] },

        // Harmonic major & world / "exotic" scales
        harmonicMajor:  { label: 'Harmonic Major',            intervals: [0,2,4,5,7,8,11],  degrees: ['1','2','3','4','5','b6','7'] },
        hungarianMinor: { label: 'Hungarian Minor',           intervals: [0,2,3,6,7,8,11],  degrees: ['1','2','b3','#4','5','b6','7'] },

        neapolitanMinor:{ label: 'Neapolitan Minor',          intervals: [0,1,3,5,7,8,11],  degrees: ['1','b2','b3','4','5','b6','7'] },
        neapolitanMajor:{ label: 'Neapolitan Major',          intervals: [0,1,3,5,7,9,11],  degrees: ['1','b2','b3','4','5','6','7'] },
        enigmatic:      { label: 'Enigmatic',                 intervals: [0,1,4,6,8,10,11], degrees: ['1','b2','3','#4','#5','#6','7'] },
        persian:        { label: 'Persian',                   intervals: [0,1,4,5,6,8,11],  degrees: ['1','b2','3','4','b5','b6','7'] },

        // Pentatonic & blues
        majPent:        { label: 'Major Pentatonic',          intervals: [0,2,4,7,9],       degrees: ['1','2','3','5','6'] },

        dimWholeHalf:   { label: 'Diminished (Whole-Half)',   intervals: [0,2,3,5,6,8,9,11],degrees: ['1','2','b3','4','b5','b6','6','7'] },
        dimHalfWhole:   { label: 'Diminished (Half-Whole)',   intervals: [0,1,3,4,6,7,9,10],degrees: ['1','b2','b3','3','#4','5','6','b7'] },

        // Bebop
        bebopDominant:  { label: 'Bebop Dominant',            intervals: [0,2,4,5,7,9,10,11], degrees: ['1','2','3','4','5','6','b7','7'] },
        bebopMajor:     { label: 'Bebop Major',               intervals: [0,2,4,5,7,8,9,11], degrees: ['1','2','3','4','5','#5','6','7'] },
        bebopMinor:     { label: 'Bebop Minor (Dorian)',      intervals: [0,2,3,4,5,7,9,10], degrees: ['1','2','b3','3','4','5','6','b7'] },
    };

    const SCALE_ALIASES = {
        'major':'major', 'maj':'major', 'ionian':'major',
        'minor':'naturalMinor', 'min':'naturalMinor', 'natural minor':'naturalMinor', 'aeolian':'naturalMinor',
        'dorian':'dorian', 'phrygian':'phrygian', 'lydian':'lydian',
        'mixolydian':'mixolydian', 'mixo':'mixolydian',
        'locrian':'locrian',

        'melodic minor':'melodicMinor', 'melodicminor':'melodicMinor',
        'dorian b2':'dorianB2', 'phrygian nat6':'dorianB2', 'assyrian':'dorianB2',
        'lydian augmented':'lydianAugmented', 'lydian aug':'lydianAugmented',
        'lydian dominant':'lydianDominant', 'overtone':'lydianDominant', 'overtone scale':'lydianDominant', 'lydian b7':'lydianDominant',
        'mixolydian b6':'mixolydianB6', 'melodic major':'mixolydianB6', 'aeolian dominant':'mixolydianB6',
        'locrian nat2':'locrianNat6', 'locrian natural 2':'locrianNat6', 'half diminished':'locrianNat6', 'half-diminished':'locrianNat6',
        'altered':'altered', 'super locrian':'altered', 'altered dominant':'altered',

        'harmonic minor':'harmonicMinor', 'harmonicminor':'harmonicMinor',
        'locrian nat6':'locrianSharp6', 'locrian natural 6':'locrianSharp6', 'locrian sharp6':'locrianSharp6', 'locrian #6':'locrianSharp6',
        'ionian sharp5':'ionianSharp5', 'ionian #5':'ionianSharp5', 'augmented major':'ionianSharp5',
        'dorian sharp4':'dorianSharp4', 'dorian #4':'dorianSharp4', 'ukrainian dorian':'dorianSharp4', 'romanian minor':'dorianSharp4', 'misheberak':'dorianSharp4',
        'phrygian dominant':'phrygianDominant', 'spanish phrygian':'phrygianDominant', 'freygish':'phrygianDominant', 'spanish gypsy':'phrygianDominant',
        'lydian sharp2':'lydianSharp2', 'lydian #2':'lydianSharp2',
        'ultra locrian':'ultraLocrian', 'ultralocrian':'ultraLocrian', 'super locrian bb7':'ultraLocrian',

        'harmonic major':'harmonicMajor', 'harmonicmajor':'harmonicMajor',
        'hungarian minor':'hungarianMinor', 'gypsy minor':'hungarianMinor', 'double harmonic minor':'hungarianMinor',
        'hungarian major':'hungarianMajor',
        'double harmonic':'doubleHarmonic', 'byzantine':'doubleHarmonic', 'arabic':'doubleHarmonic', 'double harmonic major':'doubleHarmonic',
        'neapolitan minor':'neapolitanMinor',
        'neapolitan major':'neapolitanMajor',
        'enigmatic':'enigmatic',
        'persian':'persian',

        'major pentatonic':'majPent', 'maj pentatonic':'majPent', 'major pent':'majPent', 'maj pent':'majPent', 'pentatonic major':'majPent',
        'minor pentatonic':'minPent', 'min pentatonic':'minPent', 'minor pent':'minPent', 'min pent':'minPent', 'pentatonic minor':'minPent',
        'pentatonic':'minPent', 'pent':'minPent',
        'blues':'blues', 'blues scale':'blues', 'minor blues':'blues',
        'major blues':'majorBlues', 'blues major':'majorBlues',
        'suspended pentatonic':'suspendedPent', 'egyptian':'suspendedPent', 'egyptian pentatonic':'suspendedPent', 'suspended pent':'suspendedPent',
        'hirajoshi':'hirajoshi',
        'in sen':'inSen', 'insen':'inSen',
        'iwato':'iwato',
        'kumoi':'kumoi', 'kumoy':'kumoi',
        'yo scale':'yoScale', 'yo':'yoScale', 'ritsu':'yoScale',

        'whole tone':'wholeTone', 'wholetone':'wholeTone',
        'diminished whole half':'dimWholeHalf', 'whole half':'dimWholeHalf', 'whole-half':'dimWholeHalf', 'diminished':'dimWholeHalf', 'octatonic':'dimWholeHalf',
        'diminished half whole':'dimHalfWhole', 'half whole':'dimHalfWhole', 'half-whole':'dimHalfWhole', 'dominant diminished':'dimHalfWhole',
        'augmented':'augmented', 'symmetric augmented':'augmented',
        'chromatic':'chromatic',

        'bebop dominant':'bebopDominant', 'bebop':'bebopDominant',
        'bebop major':'bebopMajor',
        'bebop minor':'bebopMinor', 'bebop dorian':'bebopMinor', 'dorian bebop':'bebopMinor',
    };

    // ── Standard tuning, top-to-bottom as on a tab chart ────────────────────
    const STRING_LABELS = ['e','B','G','D','A','E'];
    const STRING_OPEN   = [4, 11, 7, 2, 9, 4];
    const STRING_W       = [1, 1.2, 1.6, 2, 2.6, 3.2];

    const MARKER_FRETS = [3,5,7,9,12,15,17,19,21,24];

    // ── Layout constants ─────────────────────────────────────────────────
    const LEFT_W = 22, OPEN_W = 34, FRET_W = 44, TOP_PAD = 16, GAP = 28, BOT_PAD = 36, R = 10;

    const state = { root: 0, scaleKey: 'major', frets: 15, showDegrees: false, useFlats: false };

    // ── DOM refs ─────────────────────────────────────────────────────────
    const noteGridEl = document.getElementById('noteGrid');
    const scaleSelectEl = document.getElementById('scaleSelect');
    const scaleInputEl = document.getElementById('scaleInput');
    const fretCountEl = document.getElementById('fretCount');
    const fretCountValEl = document.getElementById('fretCountVal');
    const showDegreesEl = document.getElementById('showDegrees');
    const useFlatsEl = document.getElementById('useFlats');
    const svgEl = document.getElementById('fretboard');
    const scaleTitleEl = document.getElementById('scaleTitle');
    const scaleNotesListEl = document.getElementById('scaleNotesList');
    const droneBtnEl = document.getElementById('droneBtn');

    // ── Build root-note buttons ─────────────────────────────────────────
    function buildNoteGrid() {
        noteGridEl.innerHTML = '';
        const names = state.useFlats ? NOTE_FLAT : NOTE_SHARP;
        names.forEach((name, pc) => {
            const btn = document.createElement('button');
            btn.className = 'note-btn' + (pc === state.root ? ' active' : '');
            btn.textContent = name;
            btn.dataset.pc = pc;
            btn.addEventListener('click', () => {
                state.root = pc;
                syncNoteGridActive();
                render();
            });
            noteGridEl.appendChild(btn);
        });
    }
    function syncNoteGridActive() {
        [...noteGridEl.children].forEach(btn => {
            btn.classList.toggle('active', Number(btn.dataset.pc) === state.root);
        });
    }

    // ── Text parsing ("C major", "A minor pentatonic", "F# dorian") ─────
    function parseScaleText(text) {
        const m = text.trim().match(/^([A-Ga-g])\s*(#|s|sharp|b|flat)?\s*(.*)$/);
        if (!m) return null;
        const letter = m[1].toUpperCase();
        let pc = LETTER_PC[letter];
        if (pc === undefined) return null;
        const acc = (m[2] || '').toLowerCase();
        if (acc === '#' || acc === 's' || acc === 'sharp') pc += 1;
        if (acc === 'b' || acc === 'flat') pc -= 1;
        pc = ((pc % 12) + 12) % 12;
        const rest = m[3].trim().toLowerCase().replace(/\s+/g, ' ');
        if (!rest) return null;
        const scaleKey = SCALE_ALIASES[rest];
        if (!scaleKey) return null;
        return { root: pc, scaleKey, usedFlat: acc === 'b' || acc === 'flat' };
    }

    scaleInputEl.addEventListener('input', () => {
        const parsed = parseScaleText(scaleInputEl.value);
        if (!parsed) return;
        state.root = parsed.root;
        state.scaleKey = parsed.scaleKey;
        if (parsed.usedFlat) state.useFlats = true;
        useFlatsEl.checked = state.useFlats;
        buildNoteGrid();
        scaleSelectEl.value = state.scaleKey;
        render();
    });

    scaleSelectEl.addEventListener('change', () => {
        state.scaleKey = scaleSelectEl.value;
        render();
    });

    fretCountEl.addEventListener('input', () => {
        state.frets = Number(fretCountEl.value);
        fretCountValEl.textContent = state.frets;
        render();
    });

    showDegreesEl.addEventListener('change', () => {
        state.showDegrees = showDegreesEl.checked;
        render();
    });

    useFlatsEl.addEventListener('change', () => {
        state.useFlats = useFlatsEl.checked;
        buildNoteGrid();
        render();
    });

    // ── Layout helpers ───────────────────────────────────────────────────
    function dims(N) {
        const xNut = LEFT_W + OPEN_W;
        const width = xNut + N * FRET_W + 12;
        const height = TOP_PAD + GAP * 5 + BOT_PAD;
        return { xNut, width, height };
    }
    function stringY(i) { return TOP_PAD + i * GAP; }
    function cellCenter(f, xNut) { return xNut + (f - 0.5) * FRET_W; }
    function openCenter() { return LEFT_W + OPEN_W / 2; }

    function noteLabel(pitch, scale) {
        if (state.showDegrees) {
            const idx = scale.intervals.findIndex(iv => (state.root + iv) % 12 === pitch);
            return scale.degrees[idx];
        }
        return (state.useFlats ? NOTE_FLAT : NOTE_SHARP)[pitch];
    }

    // ── Render ───────────────────────────────────────────────────────────
    function render() {
        const N = state.frets;
        const scale = SCALES[state.scaleKey];
        const scaleSet = new Set(scale.intervals.map(iv => (state.root + iv) % 12));
        const { xNut, width, height } = dims(N);

        let s = '';

        STRING_OPEN.forEach((pc, i) => {
            const y = stringY(i);
            s += `<line x1="${LEFT_W}" y1="${y}" x2="${xNut + N * FRET_W}" y2="${y}" stroke="var(--ink-light)" stroke-width="${STRING_W[i]}" stroke-linecap="round"/>`;
        });

        for (let f = 1; f <= N; f++) {
            const x = xNut + f * FRET_W;
            s += `<line x1="${x}" y1="${TOP_PAD - 6}" x2="${x}" y2="${TOP_PAD + 5 * GAP + 6}" stroke="var(--border)" stroke-width="1.5"/>`;
        }

        s += `<line x1="${xNut}" y1="${TOP_PAD - 10}" x2="${xNut}" y2="${TOP_PAD + 5 * GAP + 10}" stroke="var(--ink)" stroke-width="5"/>`;

        const markY = TOP_PAD + 5 * GAP + 14;
        MARKER_FRETS.filter(f => f <= N).forEach(f => {
            const cx = cellCenter(f, xNut);
            if (f % 12 === 0) {
                s += `<circle cx="${cx}" cy="${markY - 7}" r="2.5" fill="var(--border)"/><circle cx="${cx}" cy="${markY + 7}" r="2.5" fill="var(--border)"/>`;
            } else {
                s += `<circle cx="${cx}" cy="${markY}" r="2.5" fill="var(--border)"/>`;
            }
        });

        for (let f = 1; f <= N; f++) {
            const cx = cellCenter(f, xNut);
            const isMarker = MARKER_FRETS.includes(f);
            s += `<text x="${cx}" y="${height - 8}" text-anchor="middle" font-size="8.5" fill="${isMarker ? 'var(--amber)' : 'var(--ink-muted)'}" font-weight="${isMarker ? 700 : 400}">${f}</text>`;
        }

        STRING_LABELS.forEach((lab, i) => {
            s += `<text x="${LEFT_W - 6}" y="${stringY(i) + 4}" text-anchor="end" font-size="11" font-style="italic" fill="var(--ink-muted)">${lab}</text>`;
        });

        STRING_OPEN.forEach((openPc, i) => {
            const y = stringY(i);
            for (let f = 0; f <= N; f++) {
                const pitch = (openPc + f) % 12;
                if (!scaleSet.has(pitch)) continue;
                const isRoot = pitch === state.root;
                const cx = f === 0 ? openCenter() : cellCenter(f, xNut);
                const label = noteLabel(pitch, scale);
                s += `<circle cx="${cx}" cy="${y}" r="${R}" fill="${isRoot ? 'var(--amber)' : 'var(--paper)'}" stroke="var(--ink)" stroke-width="${isRoot ? 1.6 : 1.1}"/>`;
                s += `<text x="${cx}" y="${y + 3.2}" text-anchor="middle" font-size="8.5" font-weight="${isRoot ? 700 : 400}" fill="var(--ink)">${label}</text>`;
            }
        });

        svgEl.setAttribute('viewBox', `0 0 ${width} ${height}`);
        svgEl.setAttribute('width', width);
        svgEl.setAttribute('height', height);
        svgEl.innerHTML = s;

        updateScaleDisplay(scale);
    }

    function updateScaleDisplay(scale) {
        const names = state.useFlats ? NOTE_FLAT : NOTE_SHARP;
        scaleTitleEl.textContent = `${names[state.root]} ${scale.label}`;
        scaleNotesListEl.innerHTML = scale.intervals
            .map(iv => {
                const pc = (state.root + iv) % 12;
                const n = names[pc];
                return iv === 0 ? `<span class="root-note">${n}</span>` : n;
            })
            .join(' &middot; ');
        updateDroneIfPlaying();
    }

    // ── Drone: a sustained pad chord to practice over ───────────────────
    // Built by taking every other scale degree (1-3-5-7) — the standard
    // way to read a "chord that goes with a mode" off the mode itself.
    // Holds for every mode of the major and melodic minor scales, the
    // harmonic minor/major family, and the symmetric/pentatonic/bebop
    // scales; a small number of scales that are really just an altered
    // tension palette (e.g. Altered) land on a defensible chord rather
    // than the only possible reading.
    let droneCtx = null, droneNodes = null, droneChordKey = null;

    function droneChordPitches() {
        const scale = SCALES[state.scaleKey];
        const idxs = [0, 2, 4, 6].filter(i => i < scale.intervals.length);
        return idxs.map(i => state.root + scale.intervals[i]);
    }
    function ensureDroneAudio() {
        if (!droneCtx) droneCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (droneCtx.state === 'suspended') droneCtx.resume();
        return droneCtx;
    }
    function stopDroneNodes(fast) {
        if (!droneNodes) return;
        const ctx = droneCtx;
        const now = ctx.currentTime;
        const rel = fast ? 0.06 : 0.5;
        droneNodes.master.gain.cancelScheduledValues(now);
        droneNodes.master.gain.setValueAtTime(droneNodes.master.gain.value, now);
        droneNodes.master.gain.linearRampToValueAtTime(0, now + rel);
        droneNodes.oscillators.forEach(o => o.stop(now + rel + 0.05));
        droneNodes = null;
    }
    function startDrone() {
        const ctx = ensureDroneAudio();
        stopDroneNodes(true);
        const master = ctx.createGain();
        master.gain.setValueAtTime(0, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0.13, ctx.currentTime + 0.7);
        master.connect(ctx.destination);

        const oscillators = [];
        droneChordPitches().forEach(pc => {
            const midi = 48 + ((pc % 12) + 12) % 12; // low-mid register
            const freq = 440 * Math.pow(2, (midi - 69) / 12);
            [-4, 4].forEach(detune => {
                const osc = ctx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                osc.detune.value = detune;
                const g = ctx.createGain();
                g.gain.value = 0.5;
                osc.connect(g);
                g.connect(master);
                osc.start();
                oscillators.push(osc);
            });
        });
        droneNodes = { oscillators, master };
        droneChordKey = state.root + ':' + state.scaleKey;
    }
    function stopDrone() {
        stopDroneNodes(false);
        droneChordKey = null;
        droneBtnEl.classList.remove('playing');
        droneBtnEl.innerHTML = '&#9654; Play Drone';
    }
    function updateDroneIfPlaying() {
        if (!droneNodes) return;
        const key = state.root + ':' + state.scaleKey;
        if (key === droneChordKey) return;
        startDrone();
    }
    droneBtnEl.addEventListener('click', () => {
        if (droneNodes) {
            stopDrone();
        } else {
            startDrone();
            droneBtnEl.classList.add('playing');
            droneBtnEl.innerHTML = '&#9632; Stop Drone';
        }
    });

    // ── URL param configuration (for linking from a generated session step) ─
    (function applyUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const rootParam = params.get('root');
        const scaleParam = params.get('scale');
        const fretsParam = params.get('frets');
        if (rootParam) {
            const pc = LETTER_PC[rootParam[0]?.toUpperCase()];
            if (pc !== undefined) {
                let adj = pc;
                if (rootParam.includes('#')) adj += 1;
                if (rootParam.toLowerCase().includes('b') && rootParam.length > 1) adj -= 1;
                state.root = ((adj % 12) + 12) % 12;
            }
        }
        if (scaleParam && SCALES[scaleParam]) state.scaleKey = scaleParam;
        if (fretsParam && Number(fretsParam) >= 9 && Number(fretsParam) <= 22) state.frets = Number(fretsParam);
        if (params.get('embed')) {
            document.documentElement.classList.add('is-embed');
        }
    })();

    // ── Init ─────────────────────────────────────────────────────────────
    buildNoteGrid();
    scaleSelectEl.value = state.scaleKey;
    fretCountEl.value = state.frets;
    fretCountValEl.textContent = state.frets;
    render();
</script>
</body>
</html>
