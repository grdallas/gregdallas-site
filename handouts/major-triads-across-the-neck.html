<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Major Triads Across the Neck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap">
<style>
  /* ── "Archive" design system — matches gregdallas.com ─────────────── */
  :root {
    --bg:          #F6F2EA;
    --panel:       #EFEADF;
    --ink:         #241F1A;
    --dim:         #6B6157;
    --faint:       #948A7C;
    --rule:        #DCD4C6;
    --accent:      #8A4B2A;
    --accent-soft: #B98A64;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans:  "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--serif);
    color: var(--ink);
    background: var(--bg);
    font-size: 18px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    padding: clamp(2rem, 6vw, 4rem) 1.25rem;
  }

  .sheet {
    width: 100%;
    max-width: 780px;
    margin: 0 auto;
  }

  /* ── Header ──────────────────────────────────────────────────────── */
  .sheet-head { margin-bottom: clamp(1.75rem, 4vw, 2.5rem); }
  .eyebrow {
    font-family: var(--sans);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.9rem;
  }
  .sheet-head h1 {
    font-family: var(--serif);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.12;
    font-size: clamp(2rem, 5.5vw, 2.9rem);
  }
  .sheet-head .sub {
    margin-top: 1rem;
    font-size: 1.15rem;
    font-style: italic;
    color: var(--dim);
    max-width: 54ch;
  }

  /* ── Column headers (string sets) ────────────────────────────────── */
  .col-heads {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    column-gap: 1.5rem;
    padding-bottom: 0.9rem;
    border-bottom: 1px solid var(--rule);
  }
  .col-heads span {
    text-align: center;
    font-family: var(--sans);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--faint);
  }

  /* ── Diagram grid ────────────────────────────────────────────────── */
  .chart-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    column-gap: 1.5rem;
    padding: 1.4rem 0;
  }
  .chart-row + .chart-row { border-top: 1px solid var(--rule); }

  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.7rem;
  }
  .cell svg.fretboard { display: block; }
  .cell .inv {
    font-family: var(--sans);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* ── Legend + footer ─────────────────────────────────────────────── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2rem;
    margin-top: 1.6rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--rule);
    font-family: var(--sans);
    font-size: 0.8rem;
    color: var(--dim);
  }
  .legend-item { display: flex; align-items: center; gap: 0.55rem; }
  .legend-item svg { display: block; }

  .foot {
    margin-top: 0.9rem;
    font-size: 0.95rem;
    font-style: italic;
    color: var(--faint);
  }

  /* ── Print ───────────────────────────────────────────────────────── */
  @page { size: letter portrait; margin: 0.55in; }
  @media print {
    body { padding: 0; }
    .sheet { max-width: none; }
    .chart-row, .legend { break-inside: avoid; }
  }

      /* Added for the website — hidden when printed, so the sheet stays a sheet. */
      .site-return { display:inline-block; font-family:var(--sans); font-size:.72rem;
        letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
        text-decoration:none; margin-bottom:1.4rem; }
      .site-return:hover { color:var(--accent); }
      @media print { .site-return { display:none; } }
</style>
</head>
<body>
<a class="site-return" href="../teaching.html">&larr; Teaching</a>
<div class="sheet">

  <header class="sheet-head">
    <p class="eyebrow">Fretboard Reference</p>
    <h1>Major Triads Across the Neck</h1>
    <p class="sub">All twelve major-triad shapes &mdash; four string sets, three inversions each.</p>
  </header>

  <div class="col-heads">
    <span>E &middot; A &middot; D</span>
    <span>A &middot; D &middot; G</span>
    <span>D &middot; G &middot; B</span>
    <span>G &middot; B &middot; e</span>
  </div>

  <div id="chart"></div>

  <div class="legend">
    <div class="legend-item">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8" stroke="#8A4B2A" stroke-width="2" fill="none"/>
        <circle cx="12" cy="12" r="4" fill="#8A4B2A"/>
      </svg>
      Root
    </div>
    <div class="legend-item">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4.4" fill="#241F1A"/>
      </svg>
      5th
    </div>
    <div class="legend-item">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4.4" stroke="#241F1A" stroke-width="1.6" fill="none"/>
      </svg>
      3rd
    </div>
  </div>

  <p class="foot">Low E string on the left, high e on the right. Slide any shape up or down the neck to change the root.</p>

</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  DIAGRAM DATA
//
//  Each dot: { str, fret, type }
//    str  — string number: 0 = low E, 1 = A, 2 = D, 3 = G, 4 = B, 5 = high e
//    fret — fret box: 1 = first fret box, 2 = second, etc.
//    type — 'root' | 'fifth' | 'third'
//
//  To move a dot, change its str and/or fret.
//  To change a note's quality, change its type.
// ═══════════════════════════════════════════════════════════════════

const rows = [

  // ── ROW 1 ──────────────────────────────────────────────────────
  [
    { label: "E · A · D", inv: "Root position", dots: [
      { str: 2, fret: 1, type: "fifth" },   // D — 5th
      { str: 1, fret: 3, type: "third" },   // A — 3rd
      { str: 0, fret: 4, type: "root"  },   // E — Root
    ]},
    { label: "A · D · G", inv: "1st inversion", dots: [
      { str: 2, fret: 1, type: "fifth" },   // D — 5th
      { str: 3, fret: 1, type: "root"  },   // G — Root
      { str: 1, fret: 3, type: "third" },   // A — 3rd
    ]},
    { label: "D · G · B", inv: "2nd inversion", dots: [
      { str: 2, fret: 1, type: "fifth" },   // D — 5th
      { str: 3, fret: 1, type: "root"  },   // G — Root
      { str: 4, fret: 1, type: "third" },   // B — 3rd
    ]},
    { label: "G · B · e", inv: "Root position", dots: [
      { str: 5, fret: 1, type: "fifth" },   // e — 5th
      { str: 3, fret: 3, type: "root"  },   // G — Root
      { str: 4, fret: 3, type: "third" },   // B — 3rd
    ]},
  ],

  // ── ROW 2 ──────────────────────────────────────────────────────
  [
    { label: "E · A · D", inv: "1st inversion", dots: [
      { str: 1, fret: 1, type: "fifth" },   // A — 5th
      { str: 2, fret: 1, type: "root"  },   // D — Root
      { str: 0, fret: 3, type: "third" },   // E — 3rd
    ]},
    { label: "A · D · G", inv: "2nd inversion", dots: [
      { str: 3, fret: 1, type: "third" },   // G — 3rd
      { str: 1, fret: 2, type: "fifth" },   // A — 5th
      { str: 2, fret: 2, type: "root"  },   // D — Root
    ]},
    { label: "D · G · B", inv: "Root position", dots: [
      { str: 4, fret: 1, type: "fifth" },   // B — 5th
      { str: 3, fret: 2, type: "third" },   // G — 3rd
      { str: 2, fret: 3, type: "root"  },   // D — Root
    ]},
    { label: "G · B · e", inv: "1st inversion", dots: [
      { str: 4, fret: 1, type: "fifth" },   // B — 5th
      { str: 5, fret: 1, type: "root"  },   // e — Root
      { str: 3, fret: 2, type: "third" },   // G — 3rd
    ]},
  ],

  // ── ROW 3 ──────────────────────────────────────────────────────
  [
    { label: "E · A · D", inv: "2nd inversion", dots: [
      { str: 2, fret: 1, type: "third" },   // D — 3rd
      { str: 0, fret: 2, type: "fifth" },   // E — 5th
      { str: 1, fret: 2, type: "root"  },   // A — Root
    ]},
    { label: "A · D · G", inv: "Root position", dots: [
      { str: 3, fret: 1, type: "fifth" },   // G — 5th
      { str: 2, fret: 3, type: "third" },   // D — 3rd
      { str: 1, fret: 4, type: "root"  },   // A — Root
    ]},
    { label: "D · G · B", inv: "1st inversion", dots: [
      { str: 3, fret: 1, type: "fifth" },   // G — 5th
      { str: 4, fret: 2, type: "root"  },   // B — Root
      { str: 2, fret: 3, type: "third" },   // D — 3rd
    ]},
    { label: "G · B · e", inv: "2nd inversion", dots: [
      { str: 3, fret: 1, type: "fifth" },   // G — 5th
      { str: 5, fret: 1, type: "third" },   // e — 3rd
      { str: 4, fret: 2, type: "root"  },   // B — Root
    ]},
  ],
];

// ═══════════════════════════════════════════════════════════════════
//  RENDERING  (edit below to change layout / sizing / colors)
// ═══════════════════════════════════════════════════════════════════

const STRING_GAP = 15;   // px between strings
const FRET_GAP   = 21;   // px between fret lines
const NUM_FRETS  = 5;
const NUM_STR    = 6;
const PAD_X      = 13;
const PAD_Y      = 12;
const SVG_W      = PAD_X * 2 + (NUM_STR - 1) * STRING_GAP;
const SVG_H      = PAD_Y * 2 + NUM_FRETS * FRET_GAP;

const R_INNER = 4.2;   // dot radius
const R_OUTER = 8;     // root ring radius
const INK    = "#241F1A";
const ACCENT = "#8A4B2A";

function el(tag, attrs, ...kids) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  kids.forEach(k => e.appendChild(k));
  return e;
}

function drawDiagram(diagram) {
  const svg = el("svg", {
    width: SVG_W, height: SVG_H, class: "fretboard",
    viewBox: `0 0 ${SVG_W} ${SVG_H}`,
  });

  const gridW = (NUM_STR - 1) * STRING_GAP;
  const gridH = NUM_FRETS * FRET_GAP;

  // Fret lines (equal weight — shapes are movable, so no nut)
  for (let f = 0; f <= NUM_FRETS; f++) {
    const y = PAD_Y + f * FRET_GAP;
    svg.appendChild(el("line", {
      x1: PAD_X, y1: y, x2: PAD_X + gridW, y2: y,
      stroke: INK, "stroke-width": "1.1", "stroke-linecap": "square",
    }));
  }
  // String lines
  for (let s = 0; s < NUM_STR; s++) {
    const x = PAD_X + s * STRING_GAP;
    svg.appendChild(el("line", {
      x1: x, y1: PAD_Y, x2: x, y2: PAD_Y + gridH,
      stroke: INK, "stroke-width": "1.1", "stroke-linecap": "square",
    }));
  }

  // Dots
  for (const dot of diagram.dots) {
    const cx = PAD_X + dot.str * STRING_GAP;
    const cy = PAD_Y + (dot.fret - 0.5) * FRET_GAP;

    if (dot.type === "root") {
      svg.appendChild(el("circle", { cx, cy, r: R_OUTER, stroke: ACCENT, "stroke-width": "2", fill: "none" }));
      svg.appendChild(el("circle", { cx, cy, r: R_INNER, fill: ACCENT }));
    } else if (dot.type === "fifth") {
      svg.appendChild(el("circle", { cx, cy, r: R_INNER, fill: INK }));
    } else if (dot.type === "third") {
      svg.appendChild(el("circle", { cx, cy, r: R_INNER, stroke: INK, "stroke-width": "1.6", fill: "none" }));
    }
  }

  return svg;
}

// Build DOM
const chart = document.getElementById("chart");
rows.forEach(row => {
  const rowDiv = document.createElement("div");
  rowDiv.className = "chart-row";
  row.forEach(diagram => {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.appendChild(drawDiagram(diagram));
    const inv = document.createElement("div");
    inv.className = "inv";
    inv.textContent = diagram.inv;
    cell.appendChild(inv);
    rowDiv.appendChild(cell);
  });
  chart.appendChild(rowDiv);
});
</script>
</body>
</html>
